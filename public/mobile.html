<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Time Keep Face Scan</title>
    <link rel="stylesheet" href="/styles.css?v=2026.08.07.14">
  </head>
  <body class="mobile-body">
    <main class="mobile-kiosk">
      <a class="mobile-kiosk-login" href="/mobile-admin.html?v=2026.08.07.14">Admin</a>
      <section id="mobileScanBanner" class="mobile-kiosk-banner" hidden>
        <strong id="mobileScanBannerTitle">Welcome</strong>
        <span id="mobileScanBannerMeta">Waiting for the next scan</span>
      </section>
      <button id="mobileScannerStartButton" class="mobile-kiosk-stage" type="button">
        <video id="mobileFaceScanVideo" class="mobile-camera-video mobile-kiosk-video" autoplay muted playsinline></video>
        <div class="mobile-camera-overlay mobile-kiosk-overlay">
          <div class="mobile-camera-target"></div>
          <div class="mobile-kiosk-copy">
            <p id="mobileFaceStatus" class="message">Tap anywhere to start scanner</p>
            <p id="mobileFaceHint" class="mobile-empty">Then look into the camera until your name is spoken.</p>
          </div>
        </div>
      </button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="/face-scan.js?v=2026.08.07.14"></script>
  </body>
</html>
