<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Time Keep Face Scan</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="mobile-body">
    <main class="mobile-kiosk">
      <a class="mobile-kiosk-login" href="/mobile-admin.html">Admin</a>
      <button id="mobileScannerStartButton" class="mobile-kiosk-stage" type="button">
        <video id="mobileFaceScanVideo" class="mobile-camera-video mobile-kiosk-video" autoplay muted playsinline></video>
        <div class="mobile-camera-overlay mobile-kiosk-overlay">
          <div class="mobile-camera-target"></div>
          <div class="mobile-kiosk-copy">
            <p id="mobileFaceStatus" class="message">Tap anywhere to start scanner</p>
            <p id="mobileFaceHint" class="mobile-empty">Then look into the camera until your name is spoken.</p>
          </div>
        </div>
      </button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="/face-scan.js"></script>
  </body>
</html>
