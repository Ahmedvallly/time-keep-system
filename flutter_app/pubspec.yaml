name: time_keep_mobile
description: Flutter shell for the hosted Time Keep mobile web app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.10.6
  dio: ^5.4.3
  google_mlkit_face_detection: ^0.11.0
  onnxruntime:
    path: vendor/onnxruntime
  permission_handler: ^11.3.1
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/w600k_mbf.onnx
